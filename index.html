<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ASTEROID STORM</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Share Tech Mono',monospace;color:#fff;user-select:none;}
#canvas{display:block;}

#ui{position:fixed;top:0;left:0;width:100%;pointer-events:none;}
#hud{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 20px;gap:12px;}
.hud-block{display:flex;flex-direction:column;gap:4px;}
.hud-label{font-size:0.55rem;letter-spacing:0.25em;opacity:0.5;text-transform:uppercase;}
.hud-value{font-family:'Orbitron',monospace;font-size:1.1rem;font-weight:700;color:#00f5ff;text-shadow:0 0 12px #00f5ff;}
#lives-icons{display:flex;gap:5px;align-items:center;}
.life-icon{width:16px;height:16px;opacity:0.9;}

/* Screens */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(0,0,0,0.82);backdrop-filter:blur(2px);}
.screen.hidden{display:none;}
.screen-title{font-family:'Orbitron',monospace;font-size:clamp(2.2rem,8vw,4rem);font-weight:900;letter-spacing:0.08em;text-align:center;line-height:1.1;}
.screen-title span{color:#00f5ff;text-shadow:0 0 20px #00f5ff,0 0 50px rgba(0,245,255,0.4);}
.screen-sub{font-size:0.8rem;letter-spacing:0.25em;opacity:0.5;text-align:center;}
.screen-score{font-family:'Orbitron',monospace;font-size:1.8rem;font-weight:700;color:#ffd700;text-shadow:0 0 15px #ffd700;}
.screen-hi{font-size:0.8rem;letter-spacing:0.15em;color:#888;}

.btn-play{font-family:'Orbitron',monospace;font-size:0.85rem;font-weight:700;letter-spacing:0.2em;padding:14px 40px;background:transparent;border:2px solid #00f5ff;color:#00f5ff;cursor:pointer;clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);transition:all .2s;pointer-events:all;margin-top:8px;}
.btn-play:hover{background:rgba(0,245,255,0.12);box-shadow:0 0 20px rgba(0,245,255,0.3);transform:scale(1.04);}

.controls-hint{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin-top:4px;}
.hint-item{font-size:0.65rem;letter-spacing:0.1em;opacity:0.45;display:flex;align-items:center;gap:6px;}
.key{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:4px;padding:2px 7px;font-size:0.6rem;}

/* Mobile controls */
#mobile-controls{position:fixed;bottom:0;left:0;width:100%;display:none;padding:16px 20px 24px;pointer-events:none;}
.mc-row{display:flex;justify-content:space-between;align-items:flex-end;}
.mc-left{display:flex;gap:10px;}
.mc-btn{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,0.06);border:1.5px solid rgba(0,245,255,0.3);color:#00f5ff;font-size:1.3rem;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:all;-webkit-tap-highlight-color:transparent;transition:background .1s;}
.mc-btn:active,.mc-btn.pressed{background:rgba(0,245,255,0.18);}
.mc-btn.fire{width:68px;height:68px;background:rgba(255,60,60,0.1);border-color:rgba(255,80,80,0.4);color:#ff5555;font-size:1.5rem;}
.mc-btn.fire:active,.mc-btn.fire.pressed{background:rgba(255,60,60,0.25);}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="ui">
  <div id="hud">
    <div class="hud-block">
      <span class="hud-label">Pontos</span>
      <span class="hud-value" id="score-display">0</span>
    </div>
    <div class="hud-block" style="align-items:center;">
      <span class="hud-label">Vidas</span>
      <div id="lives-icons"></div>
    </div>
    <div class="hud-block" style="align-items:flex-end;">
      <span class="hud-label">Fase</span>
      <span class="hud-value" id="wave-display">1</span>
    </div>
  </div>
</div>

<!-- Start screen -->
<div class="screen" id="screen-start">
  <p class="screen-title">ASTEROID<br/><span>STORM</span></p>
  <p class="screen-sub">// DESTRUA TODOS OS ASTEROIDES //</p>
  <div class="controls-hint">
    <span class="hint-item"><span class="key">←→</span> Girar</span>
    <span class="hint-item"><span class="key">↑</span> Acelerar</span>
    <span class="hint-item"><span class="key">Espaço</span> Atirar</span>
    <span class="hint-item"><span class="key">S</span> Escudo</span>
  </div>
  <button class="btn-play" id="btn-start">[ INICIAR MISSÃO ]</button>
</div>

<!-- Game over screen -->
<div class="screen hidden" id="screen-gameover">
  <p class="screen-title" style="color:#ff4444;text-shadow:0 0 20px #ff4444;">GAME<br/><span style="color:#ff4444;text-shadow:0 0 20px #ff4444;">OVER</span></p>
  <p class="screen-score" id="go-score">0</p>
  <p class="screen-hi" id="go-hi"></p>
  <button class="btn-play" id="btn-restart">[ TENTAR NOVAMENTE ]</button>
</div>

<!-- Mobile controls -->
<div id="mobile-controls">
  <div class="mc-row">
    <div class="mc-left">
      <div class="mc-btn" id="mc-left">◀</div>
      <div class="mc-btn" id="mc-thrust">▲</div>
      <div class="mc-btn" id="mc-right">▶</div>
    </div>
    <div style="display:flex;gap:10px;align-items:flex-end;">
      <div class="mc-btn" id="mc-shield">🛡</div>
      <div class="mc-btn fire" id="mc-fire">●</div>
    </div>
  </div>
</div>

<script>
// ─── CANVAS SETUP ────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

function resize(){
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── AUDIO ───────────────────────────────────────────────────────────────────
const AC = new (window.AudioContext || window.webkitAudioContext)();

function tone(freq, dur, type='square', vol=0.15, freqEnd=null){
  if(AC.state==='suspended') AC.resume();
  const o=AC.createOscillator(), g=AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.type=type; o.frequency.value=freq;
  if(freqEnd) o.frequency.linearRampToValueAtTime(freqEnd, AC.currentTime+dur);
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
  o.start(); o.stop(AC.currentTime+dur);
}

const SFX = {
  shoot:  ()=> tone(880,0.08,'square',0.1),
  explodeSmall: ()=>{ tone(180,0.2,'sawtooth',0.2,80); },
  explodeBig:   ()=>{ tone(100,0.4,'sawtooth',0.3,40); tone(150,0.3,'square',0.15,60); },
  thrust: ()=> tone(80+Math.random()*20, 0.05,'sawtooth',0.05),
  shield: ()=> tone(440,0.15,'sine',0.12),
  die:    ()=>{ tone(220,0.4,'sawtooth',0.3,55); },
  wave:   ()=>{ [523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,0.15,'sine',0.2),i*100)); },
};

// ─── STATE ───────────────────────────────────────────────────────────────────
let state='start'; // start | playing | dead | gameover
let score=0, hiScore=0, lives=3, wave=1;
let ship, bullets=[], asteroids=[], particles=[], stars=[];
let keys={};
let shieldCooldown=0, shieldActive=0;
let invincible=0;
let waveTransition=0;
let mobileKeys={left:false,right:false,thrust:false,fire:false,shield:false};
let fireCooldown=0;

// ─── STARS ───────────────────────────────────────────────────────────────────
function initStars(){
  stars=[];
  for(let i=0;i<200;i++){
    stars.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      r:Math.random()*1.5+0.2,
      b:Math.random()*0.7+0.3,
      twinkle:Math.random()*Math.PI*2
    });
  }
}

// ─── SHIP ────────────────────────────────────────────────────────────────────
function createShip(){
  return {
    x:canvas.width/2, y:canvas.height/2,
    vx:0, vy:0, angle:-Math.PI/2,
    radius:14,
    thrusting:false,
    thrustFlame:0,
  };
}

function drawShip(s){
  if(invincible>0 && Math.floor(invincible/4)%2===0) return;
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.angle);

  // Shield glow
  if(shieldActive>0){
    const pct=shieldActive/120;
    ctx.beginPath();
    ctx.arc(0,0,s.radius+10,0,Math.PI*2);
    ctx.strokeStyle=`rgba(0,200,255,${pct*0.6})`;
    ctx.lineWidth=2+pct*3;
    ctx.shadowColor='#00ccff';
    ctx.shadowBlur=15*pct;
    ctx.stroke();
    ctx.shadowBlur=0;
  }

  // Engine flame
  if(s.thrusting){
    s.thrustFlame = (s.thrustFlame||0)+1;
    const fl=10+Math.random()*10;
    const grad=ctx.createLinearGradient(0,0,-fl-8,0);
    grad.addColorStop(0,'rgba(255,120,0,0.9)');
    grad.addColorStop(0.4,'rgba(255,60,0,0.7)');
    grad.addColorStop(1,'rgba(255,200,0,0)');
    ctx.beginPath();
    ctx.moveTo(-10,4); ctx.lineTo(-10+fl+(Math.random()*6-3),0); ctx.lineTo(-10,-4);
    ctx.fillStyle=grad;
    ctx.fill();
  }

  // Ship body
  ctx.beginPath();
  ctx.moveTo(18,0);
  ctx.lineTo(-12,10);
  ctx.lineTo(-7,0);
  ctx.lineTo(-12,-10);
  ctx.closePath();
  ctx.strokeStyle='#00f5ff';
  ctx.lineWidth=2;
  ctx.shadowColor='#00f5ff';
  ctx.shadowBlur=8;
  ctx.stroke();
  ctx.fillStyle='rgba(0,245,255,0.07)';
  ctx.fill();
  ctx.shadowBlur=0;

  ctx.restore();
}

// ─── BULLETS ─────────────────────────────────────────────────────────────────
function shoot(){
  SFX.shoot();
  bullets.push({
    x: ship.x + Math.cos(ship.angle)*20,
    y: ship.y + Math.sin(ship.angle)*20,
    vx: Math.cos(ship.angle)*10 + ship.vx*0.3,
    vy: Math.sin(ship.angle)*10 + ship.vy*0.3,
    life: 55,
  });
}

function drawBullet(b){
  ctx.beginPath();
  ctx.arc(b.x, b.y, 3, 0, Math.PI*2);
  ctx.fillStyle='#ffe066';
  ctx.shadowColor='#ffcc00';
  ctx.shadowBlur=10;
  ctx.fill();
  ctx.shadowBlur=0;
}

// ─── ASTEROIDS ───────────────────────────────────────────────────────────────
function randAsteroid(x, y, size){
  const angle=Math.random()*Math.PI*2;
  const spd=(0.5+Math.random()*1.2)*(4-size)*0.6 + wave*0.15;
  const verts=7+Math.floor(Math.random()*5);
  const offsets=[];
  for(let i=0;i<verts;i++) offsets.push(0.75+Math.random()*0.5);
  return {x,y,vx:Math.cos(angle)*spd, vy:Math.sin(angle)*spd,
    size, radius:[0,20,34,52][size],
    rot:Math.random()*Math.PI*2, rotV:(Math.random()-0.5)*0.04,
    verts, offsets};
}

function spawnWave(){
  asteroids=[];
  const count=3+wave;
  for(let i=0;i<count;i++){
    let x,y;
    do{
      x=Math.random()*canvas.width;
      y=Math.random()*canvas.height;
    }while(dist(x,y,canvas.width/2,canvas.height/2)<150);
    asteroids.push(randAsteroid(x,y,3));
  }
}

function drawAsteroid(a){
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.rot);
  ctx.beginPath();
  for(let i=0;i<a.verts;i++){
    const ang=(i/a.verts)*Math.PI*2;
    const r=a.radius*a.offsets[i];
    if(i===0) ctx.moveTo(Math.cos(ang)*r, Math.sin(ang)*r);
    else ctx.lineTo(Math.cos(ang)*r, Math.sin(ang)*r);
  }
  ctx.closePath();
  ctx.strokeStyle='rgba(180,160,120,0.9)';
  ctx.lineWidth=2;
  ctx.shadowColor='rgba(200,180,100,0.3)';
  ctx.shadowBlur=6;
  ctx.stroke();
  ctx.fillStyle='rgba(80,60,30,0.25)';
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.restore();
}

// ─── PARTICLES ───────────────────────────────────────────────────────────────
function explode(x, y, count, color='#ff8833'){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const spd=1+Math.random()*4;
    particles.push({
      x,y,
      vx:Math.cos(a)*spd, vy:Math.sin(a)*spd,
      life:1, decay:0.02+Math.random()*0.03,
      size:1+Math.random()*3,
      color
    });
  }
}

function drawParticle(p){
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.size*p.life, 0, Math.PI*2);
  ctx.fillStyle=p.color;
  ctx.globalAlpha=p.life;
  ctx.fill();
  ctx.globalAlpha=1;
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function dist(x1,y1,x2,y2){ return Math.hypot(x2-x1,y2-y1); }
function wrap(obj){
  const W=canvas.width, H=canvas.height;
  if(obj.x< -60) obj.x=W+60;
  if(obj.x>W+60) obj.x=-60;
  if(obj.y< -60) obj.y=H+60;
  if(obj.y>H+60) obj.y=-60;
}

// ─── HUD ─────────────────────────────────────────────────────────────────────
function updateHUD(){
  document.getElementById('score-display').textContent=score;
  document.getElementById('wave-display').textContent=wave;
  const el=document.getElementById('lives-icons');
  el.innerHTML='';
  for(let i=0;i<lives;i++){
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','-14 -12 28 24');
    svg.classList.add('life-icon');
    const p=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    p.setAttribute('points','12,0 -8,7 -5,0 -8,-7');
    p.setAttribute('fill','none');
    p.setAttribute('stroke','#00f5ff');
    p.setAttribute('stroke-width','2');
    svg.appendChild(p);
    el.appendChild(svg);
  }
}

// ─── INIT GAME ───────────────────────────────────────────────────────────────
function initGame(){
  score=0; lives=3; wave=1;
  ship=createShip();
  bullets=[]; particles=[]; 
  shieldCooldown=0; shieldActive=0; invincible=0;
  fireCooldown=0;
  spawnWave();
  initStars();
  updateHUD();
}

// ─── UPDATE ──────────────────────────────────────────────────────────────────
function update(){
  if(state!=='playing') return;

  // Input
  const left  = keys['ArrowLeft']  || keys['a'] || mobileKeys.left;
  const right = keys['ArrowRight'] || keys['d'] || mobileKeys.right;
  const thrust= keys['ArrowUp']    || keys['w'] || mobileKeys.thrust;
  const fire  = keys[' ']                        || mobileKeys.fire;
  const shield= keys['s']          || keys['S'] || mobileKeys.shield;

  if(left)  ship.angle -= 0.055;
  if(right) ship.angle += 0.055;

  ship.thrusting = thrust;
  if(thrust){
    ship.vx += Math.cos(ship.angle)*0.25;
    ship.vy += Math.sin(ship.angle)*0.25;
    if(Math.random()<0.4) SFX.thrust();
    if(Math.random()<0.5) particles.push({
      x:ship.x - Math.cos(ship.angle)*14,
      y:ship.y - Math.sin(ship.angle)*14,
      vx:-Math.cos(ship.angle)*(1+Math.random()*2)+ship.vx*0.1,
      vy:-Math.sin(ship.angle)*(1+Math.random()*2)+ship.vy*0.1,
      life:1, decay:0.07+Math.random()*0.06,
      size:2+Math.random()*2,
      color:`hsl(${30+Math.random()*30},100%,60%)`
    });
  }

  // Friction
  ship.vx *= 0.985; ship.vy *= 0.985;
  const maxSpd=8; const spd=Math.hypot(ship.vx,ship.vy);
  if(spd>maxSpd){ ship.vx=ship.vx/spd*maxSpd; ship.vy=ship.vy/spd*maxSpd; }

  ship.x += ship.vx; ship.y += ship.vy;
  wrap(ship);

  // Shield
  if(shieldCooldown>0) shieldCooldown--;
  if(shieldActive>0) shieldActive--;
  if(shield && shieldCooldown===0 && shieldActive===0){
    shieldActive=120; shieldCooldown=300;
    SFX.shield();
  }

  // Fire
  fireCooldown = Math.max(0, fireCooldown-1);
  if(fire && fireCooldown===0){ shoot(); fireCooldown=12; }

  // Bullets
  bullets = bullets.filter(b=>b.life>0);
  bullets.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; b.life--; wrap(b); });

  // Asteroids
  asteroids.forEach(a=>{ a.x+=a.vx; a.y+=a.vy; a.rot+=a.rotV; wrap(a); });

  // Twinkle stars
  stars.forEach(s=>s.twinkle+=0.04);

  // Bullet vs asteroid
  for(let bi=bullets.length-1;bi>=0;bi--){
    const b=bullets[bi];
    for(let ai=asteroids.length-1;ai>=0;ai--){
      const a=asteroids[ai];
      if(dist(b.x,b.y,a.x,a.y)<a.radius){
        bullets.splice(bi,1);
        const pts=[0,50,100,200][a.size];
        score+=pts;
        explode(a.x,a.y,a.size===3?20:a.size===2?12:7, a.size===3?'#cc8833':a.size===2?'#aa6622':'#886611');
        if(a.size===3) SFX.explodeBig();
        else SFX.explodeSmall();
        // Split
        if(a.size>1){
          asteroids.push(randAsteroid(a.x,a.y,a.size-1));
          asteroids.push(randAsteroid(a.x,a.y,a.size-1));
        }
        asteroids.splice(ai,1);
        updateHUD();
        break;
      }
    }
  }

  // Ship vs asteroid
  if(invincible===0){
    for(const a of asteroids){
      if(dist(ship.x,ship.y,a.x,a.y)<a.radius+ship.radius-4){
        if(shieldActive>0){
          // Bounce asteroid
          const nx=(a.x-ship.x), ny=(a.y-ship.y), len=Math.hypot(nx,ny);
          a.vx=(nx/len)*3; a.vy=(ny/len)*3;
          shieldActive=0; shieldCooldown=300;
          SFX.shield();
          explode(ship.x,ship.y,15,'#00ccff');
        } else {
          hitShip();
        }
        break;
      }
    }
  }

  if(invincible>0) invincible--;

  // Next wave
  if(asteroids.length===0 && waveTransition===0){
    waveTransition=120;
    SFX.wave();
  }
  if(waveTransition>0){
    waveTransition--;
    if(waveTransition===0){ wave++; spawnWave(); updateHUD(); }
  }

  // Particles
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vx*=0.96; p.vy*=0.96; p.life-=p.decay; });
  particles=particles.filter(p=>p.life>0);
}

function hitShip(){
  SFX.die();
  explode(ship.x,ship.y,30,'#ff4400');
  explode(ship.x,ship.y,20,'#ffaa00');
  lives--;
  updateHUD();
  if(lives<=0){
    if(score>hiScore) hiScore=score;
    state='gameover';
    document.getElementById('go-score').textContent='Pontuação: '+score;
    document.getElementById('go-hi').textContent = score>=hiScore&&hiScore>0 ? '🏆 NOVO RECORDE!' : 'Recorde: '+hiScore;
    document.getElementById('screen-gameover').classList.remove('hidden');
  } else {
    ship=createShip();
    invincible=180;
  }
}

// ─── DRAW ─────────────────────────────────────────────────────────────────────
function draw(){
  // Background
  const grad=ctx.createRadialGradient(canvas.width/2,canvas.height/2,0,canvas.width/2,canvas.height/2,Math.max(canvas.width,canvas.height)*0.8);
  grad.addColorStop(0,'#060b18');
  grad.addColorStop(1,'#000204');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Stars
  stars.forEach(s=>{
    const b=s.b*(0.6+0.4*Math.sin(s.twinkle));
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${b})`;
    ctx.fill();
  });

  // Nebula blob
  const nb=ctx.createRadialGradient(canvas.width*0.3,canvas.height*0.4,0,canvas.width*0.3,canvas.height*0.4,300);
  nb.addColorStop(0,'rgba(30,0,60,0.18)');
  nb.addColorStop(1,'transparent');
  ctx.fillStyle=nb; ctx.fillRect(0,0,canvas.width,canvas.height);
  const nb2=ctx.createRadialGradient(canvas.width*0.75,canvas.height*0.65,0,canvas.width*0.75,canvas.height*0.65,250);
  nb2.addColorStop(0,'rgba(0,20,50,0.15)');
  nb2.addColorStop(1,'transparent');
  ctx.fillStyle=nb2; ctx.fillRect(0,0,canvas.width,canvas.height);

  particles.forEach(drawParticle);
  asteroids.forEach(drawAsteroid);
  bullets.forEach(drawBullet);
  if(state==='playing') drawShip(ship);

  // Wave transition msg
  if(waveTransition>0 && waveTransition<100){
    const alpha=Math.min(1,(100-waveTransition)/20);
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.font='bold 1.1rem Orbitron, monospace';
    ctx.fillStyle='#00f5ff';
    ctx.textAlign='center';
    ctx.shadowColor='#00f5ff'; ctx.shadowBlur=15;
    ctx.fillText(`FASE ${wave+1}`, canvas.width/2, canvas.height/2);
    ctx.shadowBlur=0;
    ctx.restore();
  }

  // Shield cooldown bar
  if(state==='playing' && shieldCooldown>0){
    const pct=1-shieldCooldown/300;
    ctx.fillStyle='rgba(0,245,255,0.15)';
    ctx.fillRect(20, canvas.height-10, 100, 4);
    ctx.fillStyle='rgba(0,200,255,0.7)';
    ctx.fillRect(20, canvas.height-10, 100*pct, 4);
  }
}

// ─── LOOP ─────────────────────────────────────────────────────────────────────
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

// ─── CONTROLS ────────────────────────────────────────────────────────────────

// Mobile
function isMobile(){ return window.innerWidth<900 || 'ontouchstart' in window; }
function setupMobile(){
  const mc=document.getElementById('mobile-controls');
  if(isMobile()) mc.style.display='block';

  const map=[
    ['mc-left','left'],['mc-right','right'],
    ['mc-thrust','thrust'],['mc-fire','fire'],['mc-shield','shield']
  ];
  map.forEach(([id,k])=>{
    const el=document.getElementById(id);
    el.addEventListener('touchstart',e=>{ e.preventDefault(); mobileKeys[k]=true; el.classList.add('pressed'); },{passive:false});
    el.addEventListener('touchend',  e=>{ e.preventDefault(); mobileKeys[k]=false; el.classList.remove('pressed'); },{passive:false});
    el.addEventListener('mousedown', ()=>{ mobileKeys[k]=true;  el.classList.add('pressed'); });
    el.addEventListener('mouseup',   ()=>{ mobileKeys[k]=false; el.classList.remove('pressed'); });
  });
}
setupMobile();
window.addEventListener('resize',()=>{
  const mc=document.getElementById('mobile-controls');
  if(isMobile()) mc.style.display='block'; else mc.style.display='none';
});

// ─── SCREENS ─────────────────────────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click',()=>{
  document.getElementById('screen-start').classList.add('hidden');
  initGame();
  state='playing';
  if(AC.state==='suspended') AC.resume();
});

document.getElementById('btn-restart').addEventListener('click',()=>{
  document.getElementById('screen-gameover').classList.add('hidden');
  initGame();
  state='playing';
  if(AC.state==='suspended') AC.resume();
});

// ─── BOOT ────────────────────────────────────────────────────────────────────
initStars();
loop();
</script>
