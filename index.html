<script>
(() => {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highEl = document.getElementById('high');
    const livesEl = document.getElementById('lives');
    const levelEl = document.getElementById('level');
    const centerMsg = document.getElementById('centerMsg');

    let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
    function resize() {
        W = canvas.clientWidth = window.innerWidth;
        H = canvas.clientHeight = window.innerHeight;
        canvas.width = W * DPR;
        canvas.height = H * DPR;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    window.addEventListener('resize', resize, { passive: true });
    resize();

    // Game constants
    const ROT_SPEED = 0.08;     // rad/frame
    const THRUST = 0.15;
    const FRICTION = 0.99;
    const BULLET_SPEED = 7;
    const BULLET_LIFE = 60;
    const SHIP_SIZE = 16;
    const SAFE_RADIUS = 120;

    // State
    let ship, bullets = [], asteroids = [], particles = [], stars = [];
    let score = 0, lives = 3, level = 1;
    let high = +localStorage.getItem('asteroids_high') || 0;
    highEl.textContent = high.toLocaleString();
    let gameState = 'start'; // start, playing, dead, gameover
    let invuln = 0;
    let shake = 0;
    const input = { left:false, right:false, thrust:false, fire:false };
    let fireCooldown = 0;
    let lastTime = performance.now();

    // Stars
    function initStars() {
        stars = [];
        const count = Math.floor((W * H) / 8000);
        for (let i = 0; i < count; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H,
                r: Math.random() * 1.2 + 0.2,
                a: Math.random() * 0.5 + 0.3,
                tw: Math.random() * Math.PI * 2
            });
        }
    }
    initStars();

    function resetGame() {
        score = 0;
        lives = 3;
        level = 1;
        bullets = [];
        particles = [];
        spawnShip();
        spawnAsteroids(level + 3);
        updateHUD();
    }

    function spawnShip() {
        ship = {
            x: W / 2,
            y: H / 2,
            vx: 0,
            vy: 0,
            angle: -Math.PI/2,
            radius: SHIP_SIZE * 0.9,
            alive: true
        };
        invuln = 120;
    }

    function spawnAsteroids(count) {
        asteroids = [];
        for (let i = 0; i < count; i++) {
            let x, y;
            do {
                x = Math.random() * W;
                y = Math.random() * H;
            } while (dist(x, y, W/2, H/2) < SAFE_RADIUS);
            asteroids.push(makeAsteroid(x, y, 3));
        }
    }

    function makeAsteroid(x, y, size) { // 3=large,2=med,1=small
        const radius = size === 3 ? 48 : size === 2 ? 28 : 16;
        const speed = (4 - size) * 0.6 + Math.random() * 0.8;
        const angle = Math.random() * Math.PI * 2;
        const verts = 9 + Math.floor(Math.random()*4);
        const points = [];
        for (let i = 0; i < verts; i++) {
            const a = i / verts * Math.PI * 2;
            const r = radius * (0.75 + Math.random()*0.3);
            points.push({ x: Math.cos(a)*r, y: Math.sin(a)*r });
        }
        return {
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            angle: Math.random()*Math.PI*2,
            spin: (Math.random()-0.5)*0.04,
            size,
            radius,
            points
        };
    }

    function dist(ax, ay, bx, by) {
        return Math.hypot(ax-bx, ay-by);
    }

    function wrap(obj) {
        if (obj.x < -obj.radius) obj.x = W + obj.radius;
        else if (obj.x > W + obj.radius) obj.x = -obj.radius;
        if (obj.y < -obj.radius) obj.y = H + obj.radius;
        else if (obj.y > H + obj.radius) obj.y = -obj.radius;
    }

    function updateHUD() {
        scoreEl.textContent = score.toLocaleString();
        levelEl.textContent = `Level ${level}`;
        livesEl.innerHTML = '';
        for (let i = 0; i < lives; i++) {
            const svg = `<svg class="life" viewBox="0 0 24 24" fill="none" stroke="#6ee7ff" stroke-width="2" stroke-linejoin="round"><path d="M12 5 L16 14 L20 15 L14 18 L13 23 L12 18 L11 23 L10 18 L4 15 L8 14 Z"/></svg>`;
            livesEl.insertAdjacentHTML('beforeend', svg);
        }
    }

    function fireBullet() {
        if (fireCooldown > 0 || !ship.alive) return;
        fireCooldown = 8;
        const nx = Math.cos(ship.angle);
        const ny = Math.sin(ship.angle);
        bullets.push({
            x: ship.x + nx * SHIP_SIZE,
            y: ship.y + ny * SHIP_SIZE,
            vx: ship.vx + nx * BULLET_SPEED,
            vy: ship.vy + ny * BULLET_SPEED,
            life: BULLET_LIFE
        });
        // muzzle flash
        for (let i=0;i<4;i++) particles.push(makeSpark(ship.x + nx*SHIP_SIZE, ship.y + ny*SHIP_SIZE, Math.atan2(ny,nx)));
    }

    function makeSpark(x,y,dir) {
        const sp = 2 + Math.random()*2;
        const a = dir + (Math.random()-0.5)*0.6;
        return { x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 12+Math.random()*8, size:1.5 };
    }

    function explode(x,y,color,count=24) {
        for (let i=0;i<count;i++) {
            const a = Math.random()*Math.PI*2;
            const sp = 0.5 + Math.random()*3.5;
            particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 20+Math.random()*20, size:1+Math.random()*2, color });
        }
    }

    function breakAsteroid(ast, idx) {
        explode(ast.x, ast.y, '#a78bfa', ast.size*10);
        score += ast.size === 3 ? 20 : ast.size === 2 ? 50 : 100;
        if (score > high) { high = score; localStorage.setItem('asteroids_high', high); highEl.textContent = high.toLocaleString(); }
        updateHUD();
        asteroids.splice(idx,1);
        if (ast.size > 1) {
            for (let i=0;i<2;i++) {
                const child = makeAsteroid(ast.x, ast.y, ast.size-1);
                child.vx += (Math.random()-0.5)*1.2;
                child.vy += (Math.random()-0.5)*1.2;
                asteroids.push(child);
            }
        }
    }

    function shipHit() {
        if (invuln > 0 || !ship.alive) return;
        ship.alive = false;
        explode(ship.x, ship.y, '#ff5c7a', 48);
        shake = 16;
        lives--;
        updateHUD();
        if (lives <= 0) {
            gameState = 'gameover';
            centerMsg.innerHTML = `<div class="title">GAME OVER</div><div class="subtitle">Score ${score.toLocaleString()}</div><div class="hint pulse">Press Space or Tap Fire to Restart</div>`;
            centerMsg.style.display = 'block';
        } else {
            gameState = 'dead';
            setTimeout(()=>{ spawnShip(); gameState='playing'; }, 1200);
        }
    }

    function update() {
        // Input -> ship
           shake = 16;
        lives--;
        updateHUD();
        if (lives <= 0) {
            gameState = 'gameover';
            centerMsg.innerHTML = `<div class="title">GAME OVER</div><div class="subtitle">Score ${score}</div><div class="hint pulse">Press Fire to Restart</div>`;
            centerMsg.style.display = 'block';
        } else {
            gameState = 'dead';
            setTimeout(()=>{ spawnShip(); gameState='playing'; }, 1200);
        }
    }

    function update() {
        // Input -> ship
        if (ship && ship.alive && gameState === 'playing') {
            if (input.left) ship.angle -= 0.08;
            if (input.right) ship.angle += 0.08;
            if (input.thrust) {
                ship.vx += Math.cos(ship.angle) * 0.15;
                ship.vy += Math.sin(ship.angle) * 0.15;
                if (Math.random()<0.5) particles.push({x:ship.x - Math.cos(ship.angle)*SHIP_SIZE, y:ship.y - Math.sin(ship.angle)*SHIP_SIZE, vx:(Math.random()-0.5)*1, vy:(Math.random()-0.5)*1, life:12, size:2, color:'#6ee7ff'});
            }
            ship.vx *= 0.99;
            ship.vy *= 0.99;
            ship.x += ship.vx;
            ship.y += ship.vy;
            wrap(ship);
            if (invuln > 0) invuln--;
        }

        // Bullets
        for (let i=bullets.length-1;i>=0;i--) {
            const b = bullets[i];
            b.x += b.vx; b.y += b.vy; b.life--;
            wrap(b);
            if (b.life<=0) bullets.splice(i,1);
        }

        // Asteroids
        for (const a of asteroids) {
            a.x += a.vx; a.y += a.vy; a.angle += a.spin;
            wrap(a);
        }

        // Collisions bullet-asteroid
        for (let i=bullets.length-1;i>=0;i--) {
            const b = bullets[i];
            for (let j=asteroids.length-1;j>=0;j--) {
                const a = asteroids[j];
                const dx = b.x - a.x, dy = b.y - a.y;
                if (dx*dx + dy*dy < a.r*a.r) {
                    bullets.splice(i,1);
                    splitAsteroid(j);
                    score += 100;
                    updateHUD();
                    break;
                }
            }
        }

        // Ship-asteroid
        if (ship && ship.alive && invuln===0) {
            for (const a of asteroids) {
                const dx = ship.x - a.x, dy = ship.y - a.y;
                if (dx*dx + dy*dy < (a.r + SHIP_SIZE*0.7)*(a.r + SHIP_SIZE*0.7)) {
                    shipHit();
                    break;
                }
            }
        }

        if (fireCooldown > 0) fireCooldown--;
        if (shake > 0) shake--;

        if (input.fire) {
            if (gameState === 'start' || gameState === 'gameover') {
                startGame();
            } else {
                fireBullet();
            }
        }
  }   
  function startGame() {
    resetGame();
    gameState = 'playing';
    centerMsg.style.display = 'none';
}

function draw() {
    ctx.save();
    if (shake > 0) {
        const s = shake * 0.5;
        ctx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s);
    }
    ctx.clearRect(0,0,W,H);

    // starfield
    for (const s of stars) {
        s.tw += 0.02;
        const alpha = s.a * (0.7 + Math.sin(s.tw)*0.3);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#cfe6ff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // particles
    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life/30);
        ctx.fillStyle = p.color || '#fff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // bullets
    ctx.strokeStyle = '#e8f0ff';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#6ee7ff';
    ctx.shadowBlur = 8;
    for (const b of bullets) {
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x - b.vx*0.3, b.y - b.vy*0.3);
        ctx.stroke();
    }
    ctx.shadowBlur = 0;

    // asteroids
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#b8c7ff';
    ctx.fillStyle = 'rgba(20,30,60,0.35)';
    for (const ast of asteroids) {
        ctx.save();
        ctx.translate(ast.x, ast.y);
        ctx.rotate(ast.angle);
        ctx.beginPath();
        const pts = ast.points;
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    }

    // ship
    if (ship && ship.alive) {
        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.rotate(ship.angle);
        const blink = invuln > 0 && (Math.floor(invuln/5)%2===0);
        if (!blink) {
            ctx.strokeStyle = '#e8f0ff';
            ctx.lineWidth = 2.5;
            ctx.shadowColor = '#6ee7ff';
            ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.moveTo(SHIP_SIZE, 0);
            ctx.lineTo(-SHIP_SIZE*0.7, -SHIP_SIZE*0.7);
            ctx.lineTo(-SHIP_SIZE*0.4, 0);
            ctx.lineTo(-SHIP_SIZE*0.7, SHIP_SIZE*0.7);
            ctx.closePath();
            ctx.stroke();
            ctx.fillStyle = 'rgba(110,231,255,0.25)';
            ctx.beginPath();
            ctx.arc(2,0,4,0,Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            if (input.thrust) {
                ctx.fillStyle = '#6ee7ff';
                ctx.globalAlpha = 0.8;
                ctx.beginPath();
                ctx.moveTo(-SHIP_SIZE*0.7, -4);
                ctx.lineTo(-SHIP_SIZE*1.4 - Math.random()*4, 0);
                ctx.lineTo(-SHIP_SIZE*0.7, 4);
                ctx.closePath();
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }
        ctx.restore();
    }
    ctx.restore();
}

function loop(t) {
    const dt = Math.min(32, t - lastTime);
    lastTime = t;
    update();
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Input handling
const btns = {
    left: document.getElementById('btn-left'),
    right: document.getElementById('btn-right'),
    thrust: document.getElementById('btn-thrust'),
    fire: document.getElementById('btn-fire')
};

function bindBtn(el, name) {
    const on = (e) => { e.preventDefault(); input[name]=true; el.classList.add('active'); };
    const off = (e) => { e.preventDefault(); input[name]=false; el.classList.remove('active'); };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointerleave', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('contextmenu', e=>e.preventDefault());
}
bindBtn(btns.left, 'left');
bindBtn(btns.right, 'right');
bindBtn(btns.thrust, 'thrust');
bindBtn(btns.fire, 'fire');

window.addEventListener('keydown', e => {
    const k = e.code;
    if (['ArrowLeft','KeyA'].includes(k)) input.left = true;
    if (['ArrowRight','KeyD'].includes(k)) input.right = true;
    if (['ArrowUp','KeyW'].includes(k)) input.thrust = true;
    if (['Space','Enter'].includes(k)) input.fire = true;
    if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)) e.preventDefault();
});
window.addEventListener('keyup', e => {
    const k = e.code;
    if (['ArrowLeft','KeyA'].includes(k)) input.left = false;
    if (['ArrowRight','KeyD'].includes(k)) input.right = false;
    if (['ArrowUp','KeyW'].includes(k)) input.thrust = false;
    if (['Space','Enter'].includes(k)) input.fire = false;
});

// Prevent scroll/zoom
document.addEventListener('touchmove', e => { if (e.target.closest('.btn')) e.preventDefault(); }, { passive:false });

// Init HUD
updateHUD();
centerMsg.style.display = 'block';
})();
</script>
